[project]
name = "toolshield"
version = "0.1.0"
description = "Agent-mediated cross-workflow authority escalation detection for GitHub Actions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi",
    "uvicorn"
]

[project.scripts]
toolshield = "toolshield.cli.main:app"
